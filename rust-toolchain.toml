# glass-rs targets nightly: it uses `core::hint::{likely, unlikely}`
# (likely_unlikely) and the portable `core::hint::prefetch_*` (hint_prefetch,
# tracking issue 146941). Pinned to a dated nightly so an upstream API change
# or a codegen shift cannot silently break the build or move benchmark
# layouts (see the JCC-erratum note in CLAUDE.md). Bump deliberately.
[toolchain]
channel = "nightly-2026-09-25"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
